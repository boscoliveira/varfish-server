version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: varfish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-varfish}
      POSTGRES_USER: ${POSTGRES_USER:-varfish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-varfish}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: varfish-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # VarFish Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: varfish-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-varfish}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-varfish}
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # Django settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_SETTINGS_MODULE: config.settings.production
      
      # VarFish specific
      VARFISH_ENABLE_EXOMISER_PRIORITISER: ${VARFISH_ENABLE_EXOMISER_PRIORITISER:-0}
      VARFISH_ENABLE_CADD: ${VARFISH_ENABLE_CADD:-0}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-change-me-in-production}
    volumes:
      - static_files:/usr/src/app/static
      - media_files:/usr/src/app/media
      - ./backend:/usr/src/app/backend:ro
      - ./frontend:/usr/src/app/frontend:ro
    ports:
      - "8080:8080"
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 4 --timeout 300
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker for background tasks
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: varfish-celery-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-varfish}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-varfish}
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # Django settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_SETTINGS_MODULE: config.settings.production
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-change-me-in-production}
    volumes:
      - media_files:/usr/src/app/media
      - ./backend:/usr/src/app/backend:ro
    command: celery -A config.celery worker -l info --concurrency=2

  # Celery Beat for scheduled tasks
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: varfish-celery-beat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-varfish}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-varfish}
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      
      # Django settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_SETTINGS_MODULE: config.settings.production
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-change-me-in-production}
    volumes:
      - ./backend:/usr/src/app/backend:ro
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: varfish-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/usr/share/nginx/html/static:ro
      - media_files:/usr/share/nginx/html/media:ro
      - nginx_certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local
  nginx_certs:
    driver: local

networks:
  default:
    name: varfish-network
    driver: bridge